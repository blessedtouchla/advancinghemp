name: Fetch group post photos

on:
  push:
    branches: [main]
    paths: ["data/groups.json"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-bot
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow
      - name: Download, resize and record photos
        run: python3 scripts/group_images.py
      - name: Commit photos if anything changed
        run: |
          git config user.name "advancing-hemp-news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/groups.json img/groups
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "groups: photos $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi
