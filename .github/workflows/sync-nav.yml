name: Sync site nav

# Rewrites the main nav + footer "Explore" list on every page from data/nav.json
# (written by tools/build.py), so a nav change doesn't require re-pushing every page.
on:
  push:
    branches: [main]
    paths: ["data/nav.json", "scripts/sync_nav.py"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-bot
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync nav
        run: python3 scripts/sync_nav.py
      - name: Commit pages if they changed
        run: |
          git config user.name "advancing-hemp-nav-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- '*.html'
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "nav: sync from data/nav.json"
            git pull --rebase origin main
            git push
          fi
