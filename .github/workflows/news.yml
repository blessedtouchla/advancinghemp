name: Refresh hemp news

on:
  schedule:
    - cron: "17 13 * * *"   # daily, 13:17 UTC (6:17 AM PDT / 5:17 AM PST)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch feeds and write news.json
        run: python3 scripts/fetch_news.py
      - name: Commit news.json if it changed
        run: |
          git config user.name "advancing-hemp-news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "news: daily refresh $(date -u +%Y-%m-%d)"
            git push
          fi
